name: Frontend UI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: npm ci
      - run: npm run tokens:test
      - run: npm run tokens:build
      - run: npm run test:shared
      - run: git diff --exit-code
      - run: npm run test:web
      - run: npm run test:mobile
      - run: npx tsc -p apps/web/tsconfig.json --noEmit
      - run: npx tsc -p apps/mobile/tsconfig.json --noEmit
      - run: npm run web:build
      - run: npm run test:web:docker
      - run: npm exec --workspace @cooking/web playwright install --with-deps chromium
      - name: Install CJK screenshot font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - run: npm --workspace @cooking/web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-ui-failure
          path: |
            apps/web/test-results
            apps/web/playwright-report

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cooking_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cooking_audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      OPENAI_API_KEY: ""
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/cooking_audit_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/cooking_audit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: cd backend && python -m alembic upgrade head
      - run: cd backend && python -m pytest -q

  delivery-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-repository.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - run: python3 scripts/test-docker-contexts.py

  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file backend/Dockerfile --tag cooking-backend:ci backend

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p audit-results
      - name: Audit locked JavaScript packages
        run: npm audit --package-lock-only --audit-level=high --json > audit-results/npm.json
      - name: Install Python audit tool
        if: always()
        run: python -m pip install pip-audit==2.10.1
      - name: Audit resolved Python runtime requirements
        if: always()
        run: python -m pip_audit -r backend/requirements.txt -f json -o audit-results/python.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-reports
          path: audit-results
